[workspace]
resolver = "3"
members = ["crates/*", "bins/*", "bench/pretest", "bench/llmgw"]

[workspace.package]
# 整个项目一个版本号，用 scripts/bump-version.sh 修改。
version = "0.1.17"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/fuqiuluo/ice3tier"

[workspace.dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
hdrhistogram = "7.6.0"
if-addrs = "0.15.0"
ipnet = { version = "2.12.2", features = ["serde"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls", "ring"] }
rcgen = "0.14.10"
ring = "0.17.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
socket2 = { version = "0.6.5", features = ["all"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[workspace.lints.clippy]
unwrap_used = "warn"
cast_possible_truncation = "warn"
needless_pass_by_value = "warn"
fn_params_excessive_bools = "warn"
undocumented_unsafe_blocks = "warn"
wildcard_imports = "warn"
return_self_not_must_use = "warn"

# 发给用户的程序用这个档位（`cargo build --profile dist`，产物在 target/…/dist/ 下）：整个程序一起做链接期优化，
# 一个代码生成单元。节点空闲时常驻内存的大头是程序自己的映像，这样小 2 MB 多（实验环境里空闲节点 14.3 MB → 11.9 MB），
# 吞吐和每 GB 的 CPU 不变或略好。代价是构建慢两三倍，所以不放进 `release`：测试和日常用的 `--release` 照旧。
# 偏体积的优化（opt-level = "s"）量过：再小 1.4 MB，每 GB 的 CPU 多一成左右，没有用。
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "debuginfo"
