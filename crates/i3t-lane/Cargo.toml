[package]
name = "i3t-lane"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "ice3tier 的独占 TCP（lane）：一对节点之间每条用户连接独占一条预先拨好、按公钥认证的 TCP"

[dependencies]
bytes.workspace = true
i3t-conn = { path = "../i3t-conn" }
i3t-crypto = { path = "../i3t-crypto" }
i3t-proto = { path = "../i3t-proto" }
i3t-underlay = { path = "../i3t-underlay" }
ring.workspace = true
rustls.workspace = true
socket2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[features]
# 给上层 crate 的测试用：同一批测试分别跑在共用的连接上和 lane 上（`i3t_lane::testing`）。
test-util = []

[dev-dependencies]
bytes.workspace = true
i3t-flow = { path = "../i3t-flow", features = ["test-util"] }
rcgen.workspace = true
tokio-rustls.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.6", features = ["net"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { version = "1.1.6", features = ["time"] }
