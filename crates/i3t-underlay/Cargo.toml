[package]
name = "i3t-underlay"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "ice3tier 的可达层：一个 UDP 端口的批量收发、本机地址、地址查询、端口映射、局域网发现"

[dependencies]
bytes.workspace = true
i3t-proto = { path = "../i3t-proto" }
if-addrs.workspace = true
igd-next = { version = "0.18.0", default-features = false, features = ["aio_tokio"] }
netdev = { version = "0.47.0", default-features = false, features = ["gateway"] }
quinn-udp = { version = "0.5.16", default-features = false, features = ["tracing"] }
ring.workspace = true
socket2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[lints]
workspace = true

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
libc = "0.2.191"
