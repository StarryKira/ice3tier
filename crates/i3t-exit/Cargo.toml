[package]
name = "i3t-exit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "ice3tier 的出口：访问控制、出站策略、解析域名、连接目标"

[dependencies]
bytes.workspace = true
dns-lookup = "4.0.2"
i3t-access = { path = "../i3t-access" }
i3t-conn = { path = "../i3t-conn" }
i3t-flow = { path = "../i3t-flow" }
i3t-model = { path = "../i3t-model" }
i3t-proto = { path = "../i3t-proto" }
if-addrs.workspace = true
ipnet.workspace = true
socket2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
base64.workspace = true
i3t-flow = { path = "../i3t-flow", features = ["test-util"] }
# 同一批测试再跑一遍在 lane 上（`i3t_lane::testing`）。
i3t-lane = { path = "../i3t-lane", features = ["test-util"] }
ring.workspace = true
# 测试里要读回保活的参数，读的接口在这个特性后面。
socket2.workspace = true
# 暂停时钟，测限速。
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
