[package]
name = "i3t-agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "ice3tier 的节点装配层：本地状态、连 controller、把各层装成一个节点"

[dependencies]
anyhow.workspace = true
i3t-access = { path = "../i3t-access" }
i3t-conn = { path = "../i3t-conn" }
i3t-crypto = { path = "../i3t-crypto" }
i3t-exit = { path = "../i3t-exit" }
i3t-flow = { path = "../i3t-flow" }
i3t-model = { path = "../i3t-model" }
i3t-proto = { path = "../i3t-proto" }
rand = "0.10.4"
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
toml = "1.2.1"
toml_edit = "0.25.19"
tracing = "0.1.44"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
