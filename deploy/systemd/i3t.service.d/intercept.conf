# 透明访问（i3t set intercept on）要的：以 i3t 用户跑的节点改这台机器的包过滤规则、策略路由和 dummy 网卡 i3t0，
# 绑 127.0.0.1:1 和自己虚拟 IP 的 53 端口。装上：
#
#   sudo install -D -m 0644 intercept.conf /etc/systemd/system/i3t.service.d/intercept.conf
#   sudo systemctl daemon-reload && sudo systemctl restart i3t
#
# i3t.service 的沙箱设置一项也不用放开：nft 和 ip 只经 netlink 说话，不写文件，也不写 /proc/sys，所以 ProtectSystem=strict、
# ProtectKernelTunables=yes 挡不着它们；NoNewPrivileges=yes 不影响 ambient 的能力，节点执行的 nft、ip 照样带着这两项。
#
# systemd-resolved 的设置是另一回事：它按 polkit 决定谁能改一块网卡的 DNS，不认 CAP_NET_ADMIN（Debian 13、Ubuntu 24.04 上都是）。
# 要名字直接能用，另外装 deploy/polkit/50-i3t-resolved.rules（里面写着装法和代价）。不装的话，名字服务的状态是 failed
# （带着 resolvectl 的原话），按虚拟 IP 照常可用，名字可以用 sudo i3t hosts --apply 写进 /etc/hosts。

[Service]
# CAP_NET_ADMIN：nft 和 ip（执行时继承下去），带标记和 IP_TRANSPARENT 的套接字。CAP_NET_BIND_SERVICE：1 号和 53 号端口。
AmbientCapabilities=CAP_NET_ADMIN CAP_NET_BIND_SERVICE
CapabilityBoundingSet=CAP_NET_ADMIN CAP_NET_BIND_SERVICE
